<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RG2 TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#000;
color:#fff;
display:flex;
height:100vh;
font-family:Arial,sans-serif;
overflow:hidden;
}

#canais{
width:260px;
min-width:260px;
background:#111;
overflow-y:auto;
}

.canal{
padding:14px;
border-bottom:1px solid #222;
cursor:pointer;
transition:.2s;
}

.canal:hover{
background:#222;
}

.canal.ativo{
background:#00aaff;
color:#fff;
}

#player{
flex:1;
position:relative;
background:#000;
}

video{
width:100%;
height:100%;
display:block;
background:#000;
object-fit:contain;
}

</style>
</head>

<body>

<div id="canais"></div>

<div id="player">
<video id="videoMain" autoplay controls playsinline></video>
</div>

<script>

let canais = [];
let canalAtual = -1;
let hlsAtual = null;

const video = document.getElementById("videoMain");
const lista = document.getElementById("canais");


async function carregar(){

    try{

        const res = await fetch("lista.m3u");

        if(!res.ok){
            throw new Error("Não foi possível carregar lista.m3u");
        }

        const txt = await res.text();

        const linhas = txt
            .split(/\r?\n/)
            .map(l => l.trim())
            .filter(Boolean);

        for(let i = 0; i < linhas.length; i++){

            if(linhas[i].startsWith("#EXTINF")){

                const nome = linhas[i]
                    .substring(linhas[i].indexOf(",") + 1)
                    .trim();

                const url = linhas[i + 1];

                if(
                    url &&
                    !url.startsWith("#")
                ){

                    canais.push({
                        nome: nome,
                        url: url
                    });

                }

            }

        }

        mostrar();

        if(canais.length > 0){
            abrir(0);
        }

    }catch(erro){

        console.error("Erro ao carregar lista:",erro);

        lista.innerHTML =
            "<div style='padding:20px;color:red'>Erro ao carregar canais.</div>";

    }

}


function mostrar(){

    lista.innerHTML = "";

    canais.forEach((canal,index)=>{

        const item = document.createElement("div");

        item.className = "canal";

        item.innerText = canal.nome;

        item.onclick = () => {
            abrir(index);
        };

        lista.appendChild(item);

    });

}


function destruirHls(){

    if(hlsAtual){

        try{
            hlsAtual.stopLoad();
        }catch(e){}

        try{
            hlsAtual.destroy();
        }catch(e){}

        hlsAtual = null;
    }

}


function abrir(index){

    if(index < 0 || index >= canais.length){
        return;
    }

    canalAtual = index;

    const url = canais[index].url;

    console.log("Abrindo:",canais[index].nome);
    console.log("URL:",url);

    destruirHls();

    video.pause();

    video.removeAttribute("src");

    video.load();


    if(Hls.isSupported()){

        const hls = new Hls({
            enableWorker:true,
            lowLatencyMode:true,
            backBufferLength:30
        });

        hlsAtual = hls;

        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(Hls.Events.MANIFEST_PARSED,()=>{

            video.play().catch(()=>{});

        });


        hls.on(Hls.Events.ERROR,(event,data)=>{

            console.error(
                "Erro HLS:",
                data.type,
                data.details,
                data.fatal
            );

            if(data.fatal){

                switch(data.type){

                    case Hls.ErrorTypes.NETWORK_ERROR:

                        console.error(
                            "Erro de rede/CORS ao acessar:",
                            url
                        );

                        hls.startLoad();

                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:

                        hls.recoverMediaError();

                        break;

                    default:

                        destruirHls();

                        break;

                }

            }

        });

    }

    else if(video.canPlayType("application/vnd.apple.mpegurl")){

        video.src = url;

        video.addEventListener(
            "loadedmetadata",
            ()=>{
                video.play().catch(()=>{});
            },
            {once:true}
        );

    }

    else{

        alert("Este navegador não suporta reprodução HLS.");

    }

    atualizar();

}


function atualizar(){

    document
        .querySelectorAll(".canal")
        .forEach((el,index)=>{

            el.classList.toggle(
                "ativo",
                index === canalAtual
            );

        });

}


document.addEventListener("keydown",(e)=>{

    if(e.key === "ArrowDown"){

        e.preventDefault();

        if(canalAtual < canais.length - 1){

            abrir(canalAtual + 1);

        }

    }


    if(e.key === "ArrowUp"){

        e.preventDefault();

        if(canalAtual > 0){

            abrir(canalAtual - 1);

        }

    }

});


window.addEventListener("beforeunload",()=>{

    destruirHls();

});


carregar();

</script>

</body>
</html>
